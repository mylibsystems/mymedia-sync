# aliases.conf — alternate title mappings
#
# This file serves two purposes, distinguished by the first field:
#
# 1. TV episode alternate-title mapping (original purpose)
#    Format: show_pattern|alternate_title|canonical_tmdb_title
#      show_pattern  : case-insensitive substring matched against the series name
#                      used when searching (folder name or TMDB show name).
#                      Use * to apply to any show.
#      alternate_title    : the title as it appears in the source file (e.g. UK/AU broadcast)
#      canonical_tmdb_title : matching words from the TMDB primary episode title
#
# 2. Movie canonical-title override (reserved "@movie" marker in field 1)
#    Format: @movie|tmdb_title|canonical_title
#      @movie         : literal marker selecting the movie-override lookup.
#      tmdb_title     : the title TMDB returns for the film (case-insensitive match).
#      canonical_title: the title to embed and to derive the folder/file name from.
#    Used by fetch_video_meta_movie() to force a curated title regardless of the
#    shorter name TMDB stores. Keeping the colon form ("Star Wars: Episode VII - ...")
#    yields a canonical embedded title consistent with the earlier episodes.
#    The two lookups never collide: the TV lookup ignores "@movie" lines (a series
#    name never equals or contains the literal "@movie"), and the movie lookup only
#    considers them.
#
# Air Crash Investigation (UK/AU) → Mayday (Canada) episode title mappings
# Source: https://en.wikipedia.org/wiki/List_of_Mayday_episodes
Air Crash|Mid-Air Collision|Deadly Crossroads
