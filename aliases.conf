# The Accident Files — minor title discrepancies (plural/compound vs TMDB canonical)
Accident Files|Perilous payloads|Perilous Payload
Accident Files|TakeOff Tragedies|Take Off Tragedies

# Movie canonical-title overrides (@movie marker) — see header section 2.
# Star Wars sequel trilogy: TMDB stores the short marketing titles ("Star Wars:
# The Force Awakens"), but the library uses the numbered "Episode N" convention to
# stay consistent with Episodes I-VI.
@movie|Star Wars: The Force Awakens|Star Wars: Episode VII - The Force Awakens
@movie|Star Wars: The Last Jedi|Star Wars: Episode VIII - The Last Jedi
@movie|Star Wars: The Rise of Skywalker|Star Wars: Episode IX - The Rise of Skywalker
