# aliases.conf — alternate episode title mappings
# Format: show_pattern|alternate_title|canonical_tmdb_title
#   show_pattern  : case-insensitive substring matched against the series name
#                   used when searching (folder name or TMDB show name).
#                   Use * to apply to any show.
#   alternate_title    : the title as it appears in the source file (e.g. UK/AU broadcast)
#   canonical_tmdb_title : matching words from the TMDB primary episode title
